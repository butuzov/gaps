version: "2"
run:
  go: "1.25"
linters:
  default: none

  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - forbidigo
    - gocritic
    - godoclint
    - ireturn
    - mirror
    - misspell
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - tagliatelle
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wastedassign

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use stdlib instead
            - pkg: math/rand$
              desc: use math/rand/v2 instead

    forbidigo:
      forbid:
        - pattern: ioutil\.*

    gocritic:
      disabled-checks:
        - appendAssign

    perfsprint:
      int-conversion: false
      err-error: false
      errorf: true
      sprintf1: false
      strconcat: false

    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: comment-spacings
        - name: dot-imports
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
      # we are not providing an API anyway... maybe someday...
      # - name: exported
      # - name: package-comments

    staticcheck:
      checks:
        - all
        - -SA1019
        - -ST1000

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
        use-field-name: false

    testifylint:
      enable-all: true
      disable:
        - error-is-as

    ireturn:
      allow:
        - generic
        - error
        - stdlib
        - .*(Repository)$
        - ^charm\.land\/bubbletea\/v2.*$ # Будьякий інтерфейс кратоса
        - ^gorm\.io\/gorm\/logger.*$ # Будьякий інтерфейс кратоса

    usetesting:
      context-background: true
      context-todo: true
      os-chdir: true
      os-mkdir-temp: true
      os-setenv: true
      os-create-temp: true
      os-temp-dir: true

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - noctx
          - perfsprint
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
    - golines

  settings:
    # gofmpt:
    #   # Module path which contains the source code being formatted.
    #   # Default: ""
    #   module-path: bitbucket.oak.in.ua/rad/r_admin
    #   # Choose whether to use the extra rules.
    #   # Default: false
    #   extra-rules: true
    gofmt:
      # Simplify code: gofmt with `-s` option.
      # Default: true
      simplify: false
      # Apply the rewrite rules to the source before reformatting.
      # https://pkg.go.dev/cmd/gofmt
      # Default: []
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
    #
    golines:
      max-len: 120
      shorten-comments: true

    gci:
      # Section configuration to compare against.
      # Section names are case-insensitive and may contain parameters in ().
      # The default order of sections is `standard > default > custom > blank > dot > alias > localmodule`.
      # If `custom-order` is `true`, it follows the order of `sections` option.
      # Default: ["standard", "default"]
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(bitbucket.oak.in.ua/rad/r_admin_be) # Custom section: groups all imports with the specified Prefix.

      # Checks that no inline comments are present.
      # Default: false
      no-inline-comments: true
      # Checks that no prefix comments (comment lines above an import) are present.
      # Default: false
      no-prefix-comments: true
      # Enable custom order of sections.
      # If `true`, make the section order the same as the order of `sections`.
      custom-order: true
      # Drops lexical ordering for custom sections.
      no-lex-order: true

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
