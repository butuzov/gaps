# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# silent: true

tasks:
  default: task --list --sort=none

  dev: &dev
    desc: Continues Development Pipeline (test-lint-build-run)
    sources:
      - ./**/*.go
      - ./*.go
    method: timestamp
    cmds:
      - clear
      - task: lints
      - task: tests
      - task: build
      - ls -lah ./bin/gaps
      # Add Tested Command Here...
      # - ./bin/gaps

  dev:all:
    <<: *dev
    desc: Continues Development Pipeline (test-lint-build-run)
    cmds:
      - clear
      - task: tests
      - task: tests:bench
      - task: lints
      - task: build
      # Add Tested Command Here...
      # - ./bin/gaps

  tests:
    desc: "qc: Run Tests"
    vars:
      TPARSE_FEATURE:
        sh: command -v tparse >/dev/null && echo true || echo false
      DEFAULT_ARGS: -test.fullpath=true -v  -covermode=atomic -coverprofile=coverage.out
    cmds:
      - cmd: set -o pipefail && go test {{.DEFAULT_ARGS}} {{.CLI_ARGS}} ./... -json | tparse -progress
        if: "{{eq .TPARSE_FEATURE \"true\"}}"
      - cmd: set -o pipefail && go test {{.DEFAULT_ARGS}} {{.CLI_ARGS}} ./...
        if: "{{eq .TPARSE_FEATURE \"false\"}}"
        silent: true

  tests:update:
    desc: "qc: Run Tests & Update Golden Files"
    cmd: task tests -- --update

  tests:bench:
    desc: "qc: Run Benchmarks"
    cmd: go test  -benchmem -run=^$  -bench "^Benchmark" {{.CLI_ARGS}} ./...

  lints:
    desc: "qc: Run Linter"
    cmd: golangci-lint run ./...

  build:
    desc: "app: build an app"
    cmd: go build -trimpath -v -ldflags="-w -s"  -o ./bin/gaps .

  install:
    desc: "app: install an app"
    cmd: go install -trimpath -v -ldflags="-w -s" .

  docker:
    desc: "app: dockerize an app (natively)"
    cmds:
      - docker build -t actions-gaps  --progress=plain .
      - docker images | grep actions

  tools:git:setup:
    desc: "tooling: Installs git commit template & commit-msg hook"
    cmds:
      - cp ./scripts/git/commit-msg .git/hooks/commit-msg
      - git config commit.template $(pwd)/scripts/git/commit-msg.template

  tools:prek:install:hooks:
    desc: "tooling: Install hooks for `prek` (pre-commit)"
    cmd: prek install -c ./.pre-commit-config.yaml

  tools:goreleaser:test:
    desc: "tooling: Test `goreleaser`"
    cmds:
      - task: tools:goreleaser:cleanup
      - goreleaser release --snapshot --clean

  tools:goreleaser:cleanup:
    cmds:
      - cmd: |
          docker images | grep gaps | awk '{print $2}' | xargs -L1 docker rmi -f
      - cmd: rm -rf dist
