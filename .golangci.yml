version: "2"
run:
  go: "1.26"

linters:
  default: none

  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - forbidigo
    - gocritic
    - godoclint
    - ireturn
    - mirror
    - misspell
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - tagliatelle
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wastedassign

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use stdlib instead
            - pkg: math/rand$
              desc: use math/rand/v2 instead

    forbidigo:
      forbid:
        - pattern: ioutil\.*

    gocritic:
      disabled-checks:
        - appendAssign

    perfsprint:
      int-conversion: false
      err-error: false
      errorf: true
      sprintf1: false
      strconcat: false

    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: comment-spacings
        - name: dot-imports
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
      # we are not providing an API anyway... maybe someday...
      # - name: exported
      # - name: package-comments

    staticcheck:
      checks:
        - all
        - -SA1019
        - -ST1000

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
        use-field-name: false

    testifylint:
      enable-all: true
      disable:
        - error-is-as

    ireturn:
      allow:
        - generic
        - error
        - stdlib
        - .*(Repository)$
        - ^charm\.land\/bubbletea\/v2.*$ # Будьякий інтерфейс кратоса
        - ^gorm\.io\/gorm\/logger.*$ # Будьякий інтерфейс кратоса

    usetesting:
      context-background: true
      context-todo: true
      os-chdir: true
      os-mkdir-temp: true
      os-setenv: true
      os-create-temp: true
      os-temp-dir: true

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - noctx
          - perfsprint
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
    - golines

  settings:
    gofmt:
      simplify: false
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"

    golines:
      max-len: 120

    gci:
      sections:
        - standard
        - default
        - prefix(github.com/butuzov/gaps)
      no-inline-comments: true
      no-prefix-comments: true
      custom-order: true
      no-lex-order: true

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
